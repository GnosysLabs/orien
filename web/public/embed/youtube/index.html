<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Orien Wallet frames this page to play YouTube videos from Community
     posts: inside the app YouTube gets no https referrer and refuses.
     ?v= must be a YouTube video id (11 of A-Z a-z 0-9 _ -); anything else
     shows nothing. Same player settings as components/market/YouTube.tsx. -->
<script>
  (function () {
    var v = new URLSearchParams(location.search).get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(v)) return;
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + v + '?rel=0&hl=en&cc_lang_pref=en';
    f.title = 'YouTube video';
    f.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
