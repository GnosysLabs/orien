[package]
name = "orien-market"
description = "The Orien marketplace's server: accounts with passkeys, listings and reviews"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
blake3.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
webauthn-rs = { version = "0.6", features = ["conditional-ui"] }
# Built from source, so the server builds the same on a Mac and for Linux.
openssl = { version = "0.10", features = ["vendored"] }
url = "2"
ureq = { version = "3", features = ["json"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
