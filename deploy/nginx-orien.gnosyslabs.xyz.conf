# /etc/nginx/sites-available/orien.gnosyslabs.xyz
# The site's old address. Everything there moves permanently to
# https://orien.network, keeping the page asked for.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orien.gnosyslabs.xyz;

    ssl_certificate /etc/letsencrypt/live/orien.gnosyslabs.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orien.gnosyslabs.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://orien.network$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name orien.gnosyslabs.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://orien.network$request_uri;
    }
}
