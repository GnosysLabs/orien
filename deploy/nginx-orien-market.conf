# /etc/nginx/snippets/orien-market.conf
# Included in the HTTPS server block of /etc/nginx/sites-available/orien.network:
#   include /etc/nginx/snippets/orien-market.conf;
# The rate limits it uses are set in /etc/nginx/conf.d/orien-market-limits.conf.

# The founder's dashboard opens only on the tailnet (tailscale serve, port
# 8448), never on the public site.
location ^~ /admin {
    return 404;
}

# Sign-in codes cost an email each: a few a minute per visitor.
location = /api/market/email/start {
    limit_req zone=orien_market_codes burst=3 nodelay;
    proxy_pass http://127.0.0.1:7200;
    include /etc/nginx/snippets/orien-market-proxy.conf;
}

location ^~ /api/market/ {
    limit_req zone=orien_market burst=40 nodelay;
    # Pictures are up to 8 MB.
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:7200;
    include /etc/nginx/snippets/orien-market-proxy.conf;
}

# The explorer's figures. The server keeps answers for 15-20 seconds, so
# visitors never reach the validators more than a few times a minute; an
# address is a few questions to them, hence the tighter limit.
location ^~ /api/explorer/ {
    limit_req zone=orien_explorer burst=10 nodelay;
    proxy_pass http://127.0.0.1:7200;
    include /etc/nginx/snippets/orien-market-proxy.conf;
}

# The explorer lives at explorer.orien.network (its own server block,
# nginx-explorer.orien.network.conf). Its pages here forward there.
location = /explorer/address/ {
    return 301 https://explorer.orien.network/address/$arg_a/;
}
location = /explorer/checkpoint/ {
    return 301 https://explorer.orien.network/checkpoint/$arg_n/;
}
location = /explorer/top/ {
    return 301 https://explorer.orien.network/top/;
}
location ^~ /explorer/ {
    return 301 https://explorer.orien.network/;
}

# The site's chat bubble, answered by the Discord bot's Orien expert
# (discord-bot/src/web.rs). Answers stream in as they are written.
location = /api/ask {
    limit_req zone=orien_ask burst=5 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:7300;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 90s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Profiles: every /u/NAME/ opens the one profile page, which reads the name
# from the address. The headers are the site's own (add_header here replaces
# those of location /).
location ^~ /u/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri /u/index.html;
}

# Your account moved from the Market to /account/.
location = /marketplace/account/ {
    return 301 /account/$is_args$args;
}
