# /etc/nginx/snippets/orien-market.conf
# Included in the HTTPS server block of /etc/nginx/sites-available/orien.network:
#   include /etc/nginx/snippets/orien-market.conf;
# The rate limits it uses are set in /etc/nginx/conf.d/orien-market-limits.conf.

# The founder's dashboard opens only on the tailnet (tailscale serve, port
# 8448), never on the public site.
location ^~ /admin {
    return 404;
}

# Sign-in codes cost an email each: a few a minute per visitor.
location = /api/market/email/start {
    limit_req zone=orien_market_codes burst=3 nodelay;
    proxy_pass http://127.0.0.1:7200;
    include /etc/nginx/snippets/orien-market-proxy.conf;
}

location ^~ /api/market/ {
    limit_req zone=orien_market burst=40 nodelay;
    # Pictures are up to 8 MB.
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:7200;
    include /etc/nginx/snippets/orien-market-proxy.conf;
}
