# /etc/nginx/snippets/orien-market-proxy.conf
# How requests are passed to the marketplace's server.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 30s;
# "no-store" unless the server set its own (see orien-market-limits.conf);
# an empty value adds no header.
add_header Cache-Control $orien_cache_control always;
add_header X-Content-Type-Options "nosniff" always;
