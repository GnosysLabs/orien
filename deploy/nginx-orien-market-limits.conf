# /etc/nginx/conf.d/orien-market-limits.conf
# Rate limits for the marketplace, by visitor. Behind Cloudflare, the
# visitor's address is in CF-Connecting-IP.
map $http_cf_connecting_ip $orien_visitor {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $orien_visitor zone=orien_market:10m rate=10r/s;
limit_req_zone $orien_visitor zone=orien_market_codes:10m rate=3r/m;
limit_req_status 429;
