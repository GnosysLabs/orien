# /etc/nginx/conf.d/orien-market-limits.conf
# Rate limits for the marketplace, by visitor. Behind Cloudflare, the
# visitor's address is in CF-Connecting-IP.
map $http_cf_connecting_ip $orien_visitor {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $orien_visitor zone=orien_market:10m rate=10r/s;
limit_req_zone $orien_visitor zone=orien_market_codes:10m rate=3r/m;
limit_req_zone $orien_visitor zone=orien_explorer:10m rate=2r/s;
limit_req_zone $orien_visitor zone=orien_ask:10m rate=12r/m;
limit_req_status 429;

# Answers that set their own caching (pictures kept for a year, explorer
# figures for seconds) keep it; every other answer is never stored.
map $upstream_http_cache_control $orien_cache_control {
    ""      "no-store";
    default "";
}
