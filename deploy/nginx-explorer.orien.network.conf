# /etc/nginx/sites-available/explorer.orien.network
# The explorer, behind Cloudflare. It is part of the website's build (pages
# under /explorer/), served here at short addresses:
#   /                    the explorer's home
#   /address/ADDRESS/    an address
#   /checkpoint/NUMBER/  a checkpoint
#   /top/                the largest wallets
#   /api/                how programs read the explorer's figures
# Anything else belongs to orien.network and is sent there.
# Certbot adds the HTTPS block and port-80 redirect on first setup:
#   certbot --nginx -d explorer.orien.network --non-interactive --agree-tos --redirect
server {
    listen 80;
    listen [::]:80;
    server_name explorer.orien.network;

    root /var/www/orien.network/current;
    error_page 404 /404.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The pages, with the site's own headers (add_header in a location
    # replaces any from outside it).
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /explorer/index.html =404;
    }
    location ^~ /address/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /explorer/address/index.html =404;
    }
    location = /top/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /explorer/top/index.html =404;
    }
    location ^~ /checkpoint/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /explorer/checkpoint/index.html =404;
    }

    location = /api/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /explorer/api/index.html =404;
    }

    location ^~ /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The explorer's figures; Market names and pictures for verified
    # wallets, and the name search. The figures are a public API (see
    # /api/), so any website may read them from a visitor's browser.
    location ^~ /api/explorer/ {
        limit_req zone=orien_explorer burst=10 nodelay;
        proxy_pass http://127.0.0.1:7200;
        include /etc/nginx/snippets/orien-market-proxy.conf;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /api/market/wallets/lookup {
        limit_req zone=orien_market burst=40 nodelay;
        proxy_pass http://127.0.0.1:7200;
        include /etc/nginx/snippets/orien-market-proxy.conf;
    }
    location = /api/market/profiles {
        limit_req zone=orien_market burst=40 nodelay;
        proxy_pass http://127.0.0.1:7200;
        include /etc/nginx/snippets/orien-market-proxy.conf;
    }
    location ^~ /api/market/images/ {
        limit_req zone=orien_market burst=40 nodelay;
        proxy_pass http://127.0.0.1:7200;
        include /etc/nginx/snippets/orien-market-proxy.conf;
    }
    location = /api/market/t {
        limit_req zone=orien_market burst=40 nodelay;
        proxy_pass http://127.0.0.1:7200;
        include /etc/nginx/snippets/orien-market-proxy.conf;
    }

    # Icons, fonts and the like are served; any page goes to orien.network.
    location ~* \.(?:png|svg|ico|woff2?|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location / {
        return 301 https://orien.network$request_uri;
    }
}
