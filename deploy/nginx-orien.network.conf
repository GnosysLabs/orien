# /etc/nginx/sites-available/orien.network
# Static protocol & design site for Orien, behind Cloudflare.
# Certbot adds the HTTPS block and port-80 redirect on first deploy.
server {
    listen 80;
    listen [::]:80;
    server_name orien.network www.orien.network;

    root /var/www/orien.network/current;
    index index.html;
    error_page 404 /404.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|svg|ico|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ =404;
    }
}
