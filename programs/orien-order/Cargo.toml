[package]
name = "orien-order"
version = "0.1.0"
edition = "2024"
description = "Orien's funded buy-order escrow on Solana: buyer deposits SOL, seller fills with ORN lock, secret settles in ~1 min"
publish = false

# Built for Solana with `cargo build-sbf`; not part of the main workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
pinocchio = { version = "0.12", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
