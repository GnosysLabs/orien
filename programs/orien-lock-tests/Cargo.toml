[package]
name = "orien-lock-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs the built orien-lock program (../orien-lock/target/deploy/orien_lock.so) in LiteSVM"

[workspace]

[dev-dependencies]
litesvm = "0.18"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = { version = "4.1", features = ["serde"] }
solana-instruction = "~3.5"
solana-address = "~2.7"
solana-clock = "~3.2"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
# For examples/devnet.rs, which talks to Solana's test network.
ureq = { version = "3", features = ["json"] }
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
solana-hash = "~4.6"
