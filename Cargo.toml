[workspace]
resolver = "3"
members = ["crates/crypto", "crates/ledger", "crates/net", "crates/cli", "crates/swap"]

[workspace.package]
version = "1.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnosysLabs/orien"

[workspace.dependencies]
orien-crypto = { path = "crates/crypto" }
orien-ledger = { path = "crates/ledger" }
orien-net = { path = "crates/net" }
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7"
blake3 = "1"
borsh = { version = "1.5", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Hashing dominates everything this code does, so even test builds are optimized.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
