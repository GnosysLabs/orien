<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Orien's rising sun in the pearl gradient, on the site's dark background,
       sized to sit inside the circle Discord crops server icons to. -->
  <defs>
    <linearGradient id="pearl" x1="76" y1="74" x2="436" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4b6d4"/>
      <stop offset="0.25" stop-color="#b8c7ff"/>
      <stop offset="0.48" stop-color="#d3b6ff"/>
      <stop offset="0.72" stop-color="#a6ead6"/>
      <stop offset="1" stop-color="#f9dda4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#1c1c26"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 256) scale(0.7) translate(-256 -258)" fill="url(#pearl)">
    <rect x="239" y="74" width="36" height="66" rx="18" />
    <rect x="239" y="74" width="36" height="66" rx="18" transform="rotate(-44 256 298)" />
    <rect x="239" y="74" width="36" height="66" rx="18" transform="rotate(44 256 298)" />
    <path d="M138 298 A118 118 0 0 1 374 298 Z" />
    <rect x="76" y="338" width="360" height="40" rx="20" />
    <rect x="156" y="406" width="200" height="36" rx="18" />
  </g>
</svg>
