<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orien</title>
<style>
  /* The wordmark's typeface, bundled so the app never fetches fonts. */
  @font-face {
    font-family: "Jost";
    src: url("fonts/Jost.ttf") format("truetype");
    font-weight: 100 900;
  }
  :root {
    color-scheme: dark;
    --ground: #26272b;
    --ground-deep: #1b1c1f;
    --ink: #eceef2;
    --dim: #9a9ca3;
    --line: #3a3b40;
    --pearl-ink: #2b2c31;
    /* The pearl: soft pinks, lilacs, mints and ice blues over silver. */
    --pearl: linear-gradient(115deg,
      #e4e2ea 0%, #f1d3e1 14%, #d8d3f4 28%, #c9e8ec 42%,
      #e9eed6 56%, #f0d6e3 70%, #d3daf4 84%, #e4e2ea 100%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 36px 32px;
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(130% 80% at 50% -10%, #34353a 0%, var(--ground) 45%, var(--ground-deep) 100%);
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
  }

  /* The living pearl: the sheen drifts slowly across, never still. */
  @keyframes drift { from { background-position: 0% 50%; } to { background-position: 300% 50%; } }
  .pearl {
    background: var(--pearl);
    background-size: 300% 100%;
    animation: drift 24s linear infinite;
  }
  .pearl-text {
    background: var(--pearl); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: drift 24s linear infinite;
  }

  h1 {
    margin: 0 0 40px; font: 500 20px/1 "Jost", sans-serif;
    text-transform: uppercase; letter-spacing: 0.38em;
  }

  .screen[hidden] { display: none; }

  .welcome h2 { font-weight: 400; font-size: 22px; margin: 60px 0 8px; }
  .welcome p { color: var(--dim); margin: 0 0 32px; max-width: 360px; }

  button {
    display: block; width: 100%; padding: 13px 18px; border-radius: 12px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary { border: 0; color: var(--pearl-ink); }
  button.quiet { margin-top: 12px; background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  button.quiet:hover { border-color: #55565c; }
  button:disabled { opacity: 0.55; cursor: wait; }

  .card {
    border-radius: 20px; padding: 26px 24px 22px; color: var(--pearl-ink);
    box-shadow: 0 18px 50px #00000059, inset 0 1px 0 #ffffffb0;
  }
  .card .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
  .card .balance { font-size: 40px; font-weight: 300; margin-top: 4px; line-height: 1.15; }
  .card .unit { font-size: 14px; margin-left: 6px; opacity: 0.6; }

  .address {
    margin-top: 22px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    display: flex; gap: 12px; align-items: center;
  }
  .address code { flex: 1; font: 11px/1.45 ui-monospace, monospace; color: var(--dim); word-break: break-all; -webkit-user-select: text; user-select: text; }
  .address button { width: auto; padding: 6px 12px; font-size: 12px; border-radius: 8px; background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }

  .facts { margin-top: 16px; color: var(--dim); font-size: 12px; }
  .facts .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .ok { background: #9fe0c0; } .warn { background: #f0c48a; } .bad { background: #f09a9a; }

  #error { margin-top: 18px; color: #f2a7a7; min-height: 1.5em; }
</style>
</head>
<body>
  <h1><span class="pearl-text">ORIEN</span></h1>

  <section class="screen welcome" id="welcome" hidden>
    <h2>Welcome</h2>
    <p>Make a new wallet to hold Orien, or open one you already have.</p>
    <button class="primary pearl" id="create">Create a wallet</button>
    <button class="quiet" id="choose">I already have a wallet</button>
  </section>

  <section class="screen" id="home" hidden>
    <div class="card pearl">
      <div class="label">Balance</div>
      <div><span class="balance" id="balance">…</span><span class="unit">units</span></div>
    </div>

    <div class="address">
      <code id="address"></code>
      <button id="copy">Copy</button>
    </div>

    <div class="facts" id="facts"></div>
  </section>

  <div id="error"></div>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  const show = (id) => { for (const s of document.querySelectorAll(".screen")) s.hidden = s.id !== id; };
  const fail = (error) => { $("error").textContent = String(error); };

  async function refresh() {
    try {
      const view = await invoke("overview_now");
      $("error").textContent = "";
      $("balance").textContent = view.balance === null ? "—" : Number(view.balance).toLocaleString();
      $("address").textContent = view.address;
      const health = view.answered === view.validators ? "ok" : view.balance === null ? "bad" : "warn";
      $("facts").innerHTML =
        `<span class="dot ${health}"></span>${view.answered} of ${view.validators} validators answered` +
        ` · ${view.payments} payments made`;
    } catch (error) {
      $("facts").innerHTML = `<span class="dot bad"></span>Not connected`;
      fail(error);
    }
  }

  async function start() {
    if (await invoke("has_wallet")) {
      show("home");
      refresh();
    } else {
      show("welcome");
    }
  }

  $("create").addEventListener("click", async () => {
    $("create").disabled = true;
    try { await invoke("create_wallet"); await start(); } catch (error) { fail(error); }
    $("create").disabled = false;
  });

  $("choose").addEventListener("click", async () => {
    try { if (await invoke("choose_wallet")) await start(); } catch (error) { fail(error); }
  });

  $("copy").addEventListener("click", async () => {
    await navigator.clipboard.writeText($("address").textContent);
    $("copy").textContent = "Copied";
    setTimeout(() => { $("copy").textContent = "Copy"; }, 1500);
  });

  setInterval(() => { if (!$("home").hidden) refresh(); }, 15000);
  start().catch(fail);
</script>
</body>
</html>
