# The Safari extension, built on its own and placed inside Orien Wallet.app
# (Contents/PlugIns). Make the Xcode project with: xcodegen
name: OrienSafari
options:
  bundleIdPrefix: network.orien.wallet
  deploymentTarget:
    macOS: "13.0"
targets:
  OrienWalletSafari:
    type: app-extension
    platform: macOS
    sources:
      - Sources
      - path: Resources
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: network.orien.wallet.safari
      PRODUCT_NAME: Orien Wallet Safari
      DEVELOPMENT_TEAM: 4PDUNTF69S
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_ENTITLEMENTS: Extension.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      # Signed as Apple notarizes it: timestamped, no debugging entitlement.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: --timestamp
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Orien Wallet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Gnosys Labs LLC"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler"
