<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="themes.css">
<script src="theme.js"></script>
<style>
  @font-face { font-family: "Jost"; src: url("Jost.ttf") format("truetype"); font-weight: 100 900; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* As the desktop wallet in its normal window: the theme's ground and
     glow, no photograph. */
  body { width: 360px; padding: 22px 22px 24px; background: var(--glow), var(--ground-deep); color: var(--ink);
    font: 14px/1.5 -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  @keyframes drift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .pearl { background: var(--pearl); background-size: 300% 100%; animation: drift 24s linear infinite; }
  .brand { background-image: var(--brand); background-size: 300% 300%; animation: drift 12s ease-in-out infinite; }

  header { display: flex; align-items: center; justify-content: space-between; height: 32px; margin-bottom: 20px; }
  .wordmark { display: inline-flex; align-items: center; gap: 9px; font: 600 15px/1 "Jost", sans-serif; }
  .wordmark .mark { width: 18px; height: 18px; -webkit-mask: url("mark.svg") center / contain no-repeat; }
  .wordmark .word { letter-spacing: 0.16em; -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* The wallet open in Orien Wallet: its icon and name, as there. */
  .wallet { display: inline-flex; align-items: center; gap: 8px; max-width: 170px; height: 32px; padding: 0 12px 0 4px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 500; }
  .wallet .coin { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font: 700 12px/1 "Jost", sans-serif; background: rgba(var(--tint), 0.063); }
  .wallet .coin.emoji { font: 15px/1 system-ui, "Apple Color Emoji", sans-serif; background: transparent; }
  .wallet .wname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { width: 32px; height: 32px; margin-left: -6px; border: 0; border-radius: 10px; background: transparent;
    color: var(--dim); cursor: pointer; display: grid; place-items: center; }
  .back:hover { background: rgba(var(--tint), 0.05); color: var(--ink); }
  h2 { margin: 0; font: 600 18px/1.2 "Jost", sans-serif; flex: 1; padding-left: 6px; }

  .card { border-radius: 22px; padding: 20px 22px 22px; color: var(--pearl-ink);
    box-shadow: 0 6px 16px rgba(var(--shade), var(--shade-a)), inset 0 1px 0 #ffffffb0; }
  .label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
  .amount { margin-top: 6px; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  /* One size for every digit, as in the app; a long balance gets smaller
     to fit, never cut. A tap switches the shorter form and every decimal. */
  .card { cursor: pointer; user-select: none; -webkit-user-select: none; }
  .balance { font-size: 36px; font-weight: 300; line-height: 40px; letter-spacing: -0.01em; white-space: nowrap; }
  .unit { font-size: 13px; opacity: 0.6; flex: none; }

  .address { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius);
    font: 12px/1.7 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); word-spacing: 2px; }
  .address .label { font: 10.5px/1 -apple-system, system-ui, sans-serif; letter-spacing: 0.1em; margin-bottom: 8px; color: var(--faint); opacity: 1; }

  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .primary { width: 100%; height: 46px; border: 0; border-radius: var(--radius); color: var(--pearl-ink); font-weight: 600;
    cursor: pointer; box-shadow: inset 0 1px 0 #ffffffb0, 0 4px 12px rgba(var(--shade), var(--shade-a)); transition: transform 0.12s, opacity 0.2s; }
  .primary:active:not(:disabled) { transform: scale(0.985); }
  .primary:disabled { opacity: 0.4; cursor: default; }
  .secondary { width: 100%; height: 46px; border-radius: var(--radius); background: transparent; border: 1px solid var(--line);
    font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .secondary:hover { background: rgba(var(--tint), 0.04); }

  .field { margin-bottom: 16px; }
  #send-go { margin-top: 6px; }
  .field label { display: block; margin-bottom: 7px; font-size: 12.5px; color: var(--dim); }
  .box { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--field); }
  .box:focus-within { border-color: var(--focus); }
  .box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; }
  .box input.mono { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; }
  .box .unit { color: var(--dim); opacity: 1; }
  /* Names to pick from as the To box is typed in: contacts, the person's
     other wallets, and people on the Market. */
  .suggest { margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .pick { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; background: none;
    text-align: left; cursor: pointer; }
  .pick + .pick { border-top: 1px solid var(--line); }
  .pick:hover, .pick.on { background: rgba(var(--tint), 0.05); }
  .pick .coin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font: 700 13px/1 "Jost", sans-serif; background: rgba(var(--tint), 0.07); }
  .pick .coin { position: relative; overflow: hidden; }
  .pick .coin img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pick .coin.emoji { font: 17px/1 system-ui, "Apple Color Emoji", sans-serif; background: transparent; }
  .pick .who { min-width: 0; }
  .pick .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick .sub { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--faint); }
  .pick .sub.words { font: 12px -apple-system, system-ui, sans-serif; }
  .hint.good { color: var(--good); }
  .max { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: transparent;
    font-size: 12px; color: var(--dim); cursor: pointer; }
  .max:hover { color: var(--ink); }
  .hint { min-height: 20px; margin-top: 7px; font-size: 12.5px; color: var(--dim); }
  .hint.bad { color: var(--bad); }
  .note { margin: 18px 0 0; color: var(--dim); font-size: 12.5px; text-align: center; line-height: 1.5; }
  .note.bad { color: var(--bad); }

  .done { text-align: center; padding: 6px 0 2px; }
  .tick { width: 56px; height: 56px; margin: 4px auto 16px; border-radius: 50%; display: grid; place-items: center; color: var(--pearl-ink); }
  .done .big { font: 400 28px/1.2 "Jost", sans-serif; }
  .done .sent-title { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .done .small { margin-top: 6px; color: var(--dim); font-size: 12.5px; }
  .done .primary { margin-top: 24px; }
</style>
</head>
<body>
  <!-- Home: the balance, the address, Send and Copy. -->
  <section id="home">
    <header><span class="wordmark"><span class="mark brand"></span><span class="word brand">ORIEN</span></span>
      <span class="wallet" id="wallet" hidden><span class="coin" id="wallet-coin"></span><span class="wname" id="wallet-name"></span></span></header>
    <div class="card pearl" id="balance-card">
      <div class="label">Balance</div>
      <div class="amount"><span class="balance" id="balance">—</span><span class="unit">ORN</span></div>
    </div>
    <div class="buttons" id="home-buttons" hidden>
      <button class="primary pearl" id="go-send">Send</button>
      <button class="secondary" id="copy">Copy address</button>
    </div>
    <p class="note" id="home-note" hidden></p>
  </section>

  <!-- Send: who to, how much, then approve. -->
  <section id="send" hidden>
    <header><button class="back" id="back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><h2>Send ORN</h2></header>
    <div class="field">
      <label for="to">To</label>
      <div class="box"><input id="to" placeholder="A name, or an Orien address" spellcheck="false" autocomplete="off"></div>
      <div class="suggest" id="suggest" hidden></div>
      <div class="hint" id="to-hint"></div>
    </div>
    <div class="field">
      <label for="amount">Amount</label>
      <div class="box"><input id="amount" placeholder="0" inputmode="decimal" autocomplete="off"><span class="unit">ORN</span><button class="max" id="max">Max</button></div>
      <div class="hint" id="amount-hint"></div>
    </div>
    <div class="field" id="pw-field" hidden>
      <label for="pw">Wallet password</label>
      <div class="box"><input id="pw" type="password" autocomplete="current-password"></div>
    </div>
    <button class="primary pearl" id="send-go" disabled>Send</button>
    <p class="note" id="send-note" hidden></p>
  </section>

  <!-- Sent. -->
  <section id="sent" hidden>
    <div class="done">
      <div class="tick pearl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="small sent-title">Sent</div>
      <div class="big" id="sent-amount"></div>
      <div class="small" id="sent-to"></div>
      <div class="small" id="sent-fee"></div>
      <button class="primary pearl" id="sent-done">Done</button>
    </div>
  </section>
  <script src="bridge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
