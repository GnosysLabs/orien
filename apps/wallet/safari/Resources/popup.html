<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg: #1c1d21; --surface: #2e2f34; --ink: #eceef2; --dim: #9b9ba2; --line: #3a3b41; --accent: #b8c7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; padding: 22px 22px 24px; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-weight: 700; letter-spacing: 0.18em; font-size: 13px; }
  .brand img { width: 22px; height: 22px; filter: invert(1); }
  .card { padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
  .label { color: var(--dim); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .balance { font-size: 30px; font-weight: 650; line-height: 1.15; }
  .balance small { font-size: 15px; color: var(--dim); font-weight: 500; margin-left: 4px; }
  .address { margin-top: 18px; font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); word-break: break-all; }
  button { margin-top: 18px; width: 100%; height: 40px; border: 0; border-radius: 12px; background: var(--accent); color: #101426;
    font: inherit; font-weight: 600; cursor: pointer; }
  .note { margin-top: 16px; color: var(--dim); font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
  <div class="brand"><img src="mark.svg" alt="">ORIEN</div>
  <div class="card" id="card">
    <div class="label">Balance</div>
    <div class="balance" id="balance">…</div>
    <div class="address" id="address"></div>
  </div>
  <button id="copy" hidden>Copy address</button>
  <p class="note" id="note">Open Orien Wallet to send.</p>
  <script src="popup.js"></script>
</body>
</html>
