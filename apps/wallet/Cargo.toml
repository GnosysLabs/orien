[package]
name = "orien-wallet"
version = "1.8.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Orien wallet, as a desktop app"

# The app builds on its own, outside the main workspace, so it can grow
# without touching the files the node and the ledger live in.
[workspace]

# The library is the whole app: the desktop program calls it, and the
# iPhone app is built from it.
[lib]
name = "orien_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# RandomX, for mining, only where the app mines: not on iPhones.
orien-net = { path = "../../crates/net", default-features = false }
orien-ledger = { path = "../../crates/ledger", default-features = false }
orien-swap = { path = "../../crates/swap" }
orien-crypto = { path = "../../crates/crypto" }
anyhow = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-haptics = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
getrandom = "0.3"
# The QR code a buyer scans with a Bitcoin wallet to pay into a swap.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Hashing dominates the wallet's work, so even debug builds are optimized.
[profile.dev]
opt-level = 2

# Desktop copies update themselves; iPhone copies come from the App Store.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
# Starting at login, so swaps and notifications carry on with no window.
tauri-plugin-autostart = "2"
orien-net = { path = "../../crates/net", features = ["randomx"] }
orien-ledger = { path = "../../crates/ledger", features = ["randomx"] }

# Touch ID and Face ID, and Apple's Keychain to keep the wallet password
# behind them: on Macs and iPhones only.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
robius-authentication = "0.3"
security-framework = "3"
# Asking for permission to show notifications.
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData", "NSError", "NSString"] }
block2 = "0.6"
objc2 = "0.6"

# Opening at login the Mac's own way (System Settings shows the app by name).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = { version = "0.3", features = ["SMAppService", "SMErrors"] }
# Telling a login start from an ordinary one.
objc2-foundation = { version = "0.3", features = ["NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }

# Signing up with Apple on iPhones, so the Market server can say when ORN
# arrives.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIResponder"] }

[dev-dependencies]
# A pretend Bitcoin network, for testing whole swaps.
orien-swap = { path = "../../crates/swap", features = ["testing"] }
